name: Linguistic regression
on:
  push:
    paths: ['src/translator/**', 'tests/**', 'package.json', '.github/workflows/linguistic-tests.yml']
  pull_request:
    paths: ['src/translator/**', 'tests/**', 'package.json', '.github/workflows/linguistic-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
